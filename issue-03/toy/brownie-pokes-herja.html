:root { --cream: #f3e8da; --paper: #fbf6ee; --ink: #352f37; --bug: #1d1a24; --red: #d8433b; --brown: #3a2b26; --tan: #c29878; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--cream); color: var(--ink); font-family: "Mali", "WenKai", system-ui, sans-serif; }
.toy { max-width: 560px; margin: 0 auto; padding: 18px 14px 26px; }
.top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
h1 { font-size: 25px; margin: 0; letter-spacing: .01em; }
h1 .zh { display: block; font-size: 17px; -webkit-text-stroke: 0; margin-top: 2px; }
.switches { display: flex; gap: 6px; flex-shrink: 0; }
.chip { font: inherit; font-size: 13px; padding: 5px 10px; border-radius: 999px; border: 2px solid var(--ink); background: var(--paper); color: var(--ink); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.hint { font-size: 15.5px; line-height: 1.45; margin: 10px 0 12px; }
.hint .zh { display: block; color: #6d6170; }
.stage { position: relative; border-radius: 18px; overflow: hidden; border: 3px solid var(--ink); background: var(--cream); aspect-ratio: 360 / 266; touch-action: manipulation; }
canvas { display: block; width: 100%; height: 100%; }
/* the score bug: the same look as the short's (dark bar, red centre plate); pass 6: wobbly plates (#wobB) under crisp lettering */
.bug { position: absolute; left: 50%; top: 9px; transform: translateX(-50%); display: flex; align-items: center; width: 86%; max-width: 420px;
  height: 34px; border-radius: 9px; color: #fff; font-size: 12.5px; letter-spacing: .06em; isolation: isolate; }
.bug::before, .bug .plate::before { content: ""; position: absolute; inset: 0; border-radius: 9px; background: #1d1a24e6; filter: url(#wobB); z-index: -1; }
.bug .plate::before { background: var(--red); border-radius: 8px; }
.bug > div { flex: 1; text-align: center; white-space: nowrap; }
.bug b { font-size: 16px; margin-left: 5px; }
.bug .plate { flex: 0 0 auto; position: relative; z-index: 0; height: 42px; padding: 0 12px; display: flex; align-items: center; font-size: 15px; }
.float { position: absolute; font-size: 28px; color: var(--red); -webkit-text-stroke: 1px var(--red); pointer-events: none; opacity: 0;
  text-shadow: 0 0 0 #fff, 2px 2px 0 #fff, -2px 2px 0 #fff, 2px -2px 0 #fff, -2px -2px 0 #fff; }
.float.go { animation: floatUp 1.1s ease-out forwards; }
@keyframes floatUp { 0% { opacity: 0; transform: translateY(10px) scale(.7); } 20% { opacity: 1; transform: translateY(0) scale(1.1); } 100% { opacity: 0; transform: translateY(-46px) scale(1); } }
.msg { min-height: 48px; margin: 10px 2px 0; font-size: 16px; line-height: 1.4; text-align: center; }
.msg .zh { display: block; font-size: 15px; color: #6d6170; }
.buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
.btn { font: inherit; font-size: 20px; padding: 12px 8px 10px; border-radius: 16px; border: 3px solid var(--ink); cursor: pointer; line-height: 1.15;
  box-shadow: 0 4px 0 var(--ink); transition: transform .06s, box-shadow .06s; -webkit-text-stroke: .5px currentColor; }

  <p class="hint">Every poke scores a point. Poke too far and Herja snaps, and you lose the round's pokes. Watch her face: she'll warn you, more or less.

<script>
// ---------- set (world units, same as art/cats.vx.js) ----------
const STAGE = [214, 480], U = 2, W = 720, H = (STAGE[1] - STAGE[0]) * U
const SPOT = [196, 438], FLOOR = 444
const cv = document.getElementById("c"), g = cv.getContext("2d")
const IMG = {}
const ready = Promise.all(Object.entries(window.ASSETS.img).map(([n, src]) => new Promise(res => { const i = new Image(); i.onload = res; i.src = src; IMG[n] = i })))
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const lerp = (a, b, k) => a + (b - a) * k
const ease = k => k * k * (3 - 2 * k), easeOut = k => 1 - Math.pow(1 - k, 3)
const prog = (t, a, b) => clamp((t - a) / (b - a))
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches
// draw a layer (world coordinates), optionally moved, scaled or rotated about a pivot, faded
function L(name, o = {}) {
  const img = IMG[name]; if (!img) return
  g.save(); g.globalAlpha = o.a ?? 1
  const px = (o.px ?? 0) * U, py = (o.py ?? 0) * U
  g.translate((o.dx ?? 0) * U + px, (o.dy ?? 0) * U + py)
  if (o.rot) g.rotate(o.rot)
  g.scale(o.sx ?? o.s ?? 1, o.sy ?? o.s ?? 1)
  g.translate(-px, -py)
  g.drawImage(img, 0, STAGE[0] * U, W, H); g.restore()
}
const breath = (t, ph = 0) => calm ? 1 : 1 + 0.014 * Math.sin((t + ph) * 2 * Math.PI / 2.6)

// ---------- sound ----------
let ac = null, soundOn = true
const BUF = {}
function audio() {
  if (ac) return
  ac = new (window.AudioContext || window.webkitAudioContext)()
  for (const [k, url] of Object.entries(window.ASSETS.snd))
    // decode the base64 by hand: sandboxed previews (claude.ai) block fetch() on data: URLs
    try {
      const bin = atob(url.split(",")[1]), bytes = new Uint8Array(bin.length)
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i)
      ac.decodeAudioData(bytes.buffer, d => BUF[k] = d, () => {})
    } catch (e) {}
}
function play(k, gain = 1) {
  if (!soundOn || !ac || !BUF[k]) return
  const s = ac.createBufferSource(), v = ac.createGain(); v.gain.value = gain
  s.buffer = BUF[k]; s.connect(v).connect(ac.destination); s.start()
}

// ---------- language ----------
let zhOn = false
const $ = id => document.getElementById(id)
function setLang(on) { zhOn = on; $("lang").setAttribute("aria-pressed", on); document.querySelectorAll(".zh").forEach(e => e.hidden = !on) }
function say(en, zh) { $("msg").innerHTML = en ? `${en}<span class="zh"${zhOn ? "" : " hidden"}>${zh}</span>` : "" }

// ---------- the game ----------
// irritation rises with each poke (hidden amount); she snaps when it reaches her breaking point (hidden, new each round).
// Waiting lets it fall, but never below the grudge (40% of every poke this round). Her face shows irr / limit, give or take.
const rnd = (a, b) => a + Math.random() * (b - a)
const S = { mode: "idle", t0: 0, pile: 0, total: 0, best: 0, round: 1, irr: 0, grudge: 0, limit: 70, noise: 0, lastPoke: -9, pokeT: -9, band: 0, sighT: -9, lost: 0 }
const BANDS = ["h_sleep", "h_meh", "h_side", "h_sigh_tail", "h_annoyed"]
const bandOf = r => r < 0.25 ? 0 : r < 0.5 ? 1 : r < 0.72 ? 2 : r < 0.88 ? 3 : 4
function newRound() {
  Object.assign(S, { mode: "idle", pile: 0, irr: 0, grudge: 0, limit: rnd(52, 100), noise: 0, band: 0, lastPoke: -9 })
  hud()
}
function hud() {
  $("pile").textContent = S.pile; $("total").textContent = S.total; $("round").textContent = "ROUND " + S.round
  $("bankBtn").disabled = S.mode !== "idle" || S.pile === 0
  $("pokeBtn").disabled = S.mode !== "idle"
  $("best").innerHTML = S.best ? `Best round: ${S.best}<span class="zh"${zhOn ? "" : " hidden"}>　最佳回合：${S.best}</span>` : ""
}
function floatText(txt) {
  const f = $("float"); f.textContent = txt; f.style.left = "13%"; f.style.top = "34%"
  f.classList.remove("go"); void f.offsetWidth; f.classList.add("go")
}
const now = () => performance.now() / 1000

function poke() {
  if (S.mode !== "idle") return
  audio(); const t = now()
  const d = rnd(9, 18)
  S.irr += d; S.grudge += 0.4 * d; S.pile++; S.lastPoke = t; S.pokeT = t
  S.noise = rnd(-0.07, 0.07)
  play("boop", 0.9)
  if (S.irr >= S.limit) return snap(t)
  const b = bandOf(S.irr / S.limit + S.noise)
  if (b === 3 && S.band < 3) { S.sighT = t; setTimeout(() => play("sigh", 0.8), 120) }
  S.band = b
  say("", ""); hud()
}
function bank() {
  if (S.mode !== "idle" || !S.pile) return
  audio(); const t = now(), got = S.pile
  S.total += got; S.best = Math.max(S.best, got)
  S.mode = "bank"; S.t0 = t; S.band = 0
  play("softding", 0.7); floatText("+" + got)
  say(`Banked +${got}. Herja dozes off again.`, `收手！+${got}，灰灰又睡著了。`)
  hud()
  setTimeout(() => { S.round++; newRound() }, 1300)
}
function snap(t) {
  S.lost = S.pile; S.pile = 0; S.mode = "snap"; S.t0 = t
  hud()
  const n = S.lost
  say(`Herja snapped! ${n === 1 ? "1 poke" : n + " pokes"} lost.`, `灰灰爆氣了！這回合${n}下都白戳了。`)
  const at = (s, f) => setTimeout(f, s * 1000)
  play("whoosh", 0.8); at(0.55, () => play("thwack")); at(0.75, () => play("v_up"))
  at(3.0, () => play("softding", 0.6)); at(3.3, () => play("snore", 0.8))
  at(6.9, () => { S.round++; newRound() })
}

// ---------- picture ----------
let lastT = now()
function frame() {
  const t = now(), k = t - S.t0, dt = Math.min(0.1, t - lastT); lastT = t
  g.clearRect(0, 0, W, H)
  g.save(); g.translate(0, -STAGE[0] * U)
  let shx = 0
  if (S.mode === "snap" && !calm && k > 0.55 && k < 0.95) shx = 3 * (1 - (k - 0.55) / 0.4) * Math.sin(t * 97)
  g.translate(shx * U, 0)
  L("room")
  if (S.mode === "idle" || S.mode === "bank") {
    // settling: after 1.6 s without a poke she calms down, but only to her grudge
    if (S.mode === "idle" && t - S.lastPoke > 1.6 && S.irr > S.grudge) {
      S.irr = Math.max(S.grudge, S.irr - 5 * dt)
      const b = bandOf(S.irr / S.limit + S.noise)
      if (b < S.band) S.band = b
    }
    const face = BANDS[S.band]
    L(face, { px: SPOT[0], py: FLOOR, sy: face === "h_sleep" ? breath(t) : 1 })
    if (face === "h_sigh_tail" && t - S.sighT < 1.8) {
      const k2 = (t - S.sighT) / 1.8
      L("sigh_puff", { dx: -14 * k2, dy: -6 * k2, a: k2 < 0.15 ? k2 / 0.15 : 1 - Math.max(0, (k2 - 0.6) / 0.4) })
    }
    if (S.mode === "bank") {
      const hop = calm ? 0 : Math.abs(Math.sin(k * Math.PI * 2.4)) * 5 * (1 - prog(k, 0.6, 1.1))
      L("b_grin", { dy: -hop })
    } else L(t - S.pokeT < 0.24 ? "b_poke" : "b_smirk")
  } else if (S.mode === "snap") {
    const bL = SPOT[0] - 70, bR = SPOT[0] + 70
    if (k < 2.7) {
      const r = easeOut(prog(k, 0, 0.4)), hit = k >= 0.55
      const tumble = ease(prog(k, 1.5, 2.2))
      if (!hit) L("k_brownie", { px: bL, py: FLOOR, sy: lerp(0.8, 1, r) })
      else if (k < 1.5) L("k_brownie_jab", { px: bL, py: FLOOR })
      else L("k_brownie", { px: bL, py: FLOOR, dx: -70 * tumble, dy: -14 * Math.sin(Math.PI * tumble), rot: -0.55 * tumble, a: 1 - prog(k, 2.0, 2.4) })
      L(hit && k < 1.5 ? "k_herja_jab" : "k_herja", { px: bR, py: FLOOR, sy: lerp(0.8, 1, r) })   // back on guard once Brownie tumbles away
      if (hit && k < 1.5) L("k_impact", { a: 1 - prog(k, 1.1, 1.5) })
      if (k > 2.3) { g.fillStyle = `rgba(243,232,218,${prog(k, 2.3, 2.7)})`; g.fillRect(0, STAGE[0] * U, W, H) }
    } else if (k < 5.4) {
      L("pair", { px: SPOT[0], py: FLOOR, sy: breath(t, 0.7), a: prog(k, 2.7, 3.0) * (1 - prog(k, 5.0, 5.4)) })
    } else {
      // she's back on her spot, alone; Brownie's paw creeps in from the edge again (the loop)
      L("h_sleep", { px: SPOT[0], py: FLOOR, sy: breath(t), a: prog(k, 5.0, 5.4) })
      const c = ease(prog(k, 5.5, 6.5)) * (1 - ease(prog(k, 6.6, 6.9)))
      const tip = lerp(-16, 84, c)
      if (c > 0.001) {
        L("creep_arm", { px: -20, py: 416, sx: Math.max(0.001, (tip + 20) / 112) })
        if (tip > 44) L("creep_stripes", { dx: tip - 92 })
        L("creep_paw", { dx: tip - 92 })
      }
      if (k > 6.6) L("b_smirk", { a: prog(k, 6.6, 6.9) })
    }
  }
  g.restore()
  requestAnimationFrame(frame)
}

// ---------- controls ----------
$("pokeBtn").addEventListener("click", poke)
$("bankBtn").addEventListener("click", bank)
$("lang").addEventListener("click", () => { setLang(!zhOn); hud(); const m = $("msg").querySelector(".zh"); if (m) m.hidden = !zhOn })
$("snd").addEventListener("click", () => { soundOn = !soundOn; $("snd").setAttribute("aria-pressed", soundOn); audio() })
document.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("button")) return
  if (e.key === " " || e.key === "p") { e.preventDefault(); poke() }
  else if (e.key === "Enter" || e.key === "i") bank()
})
// in the magazine, follow its language switch if there is one
if (window.zhOn) try { setLang(!!window.zhOn()) } catch (e) {}
ready.then(() => { newRound(); requestAnimationFrame(frame) })
</script>
</body></html>
